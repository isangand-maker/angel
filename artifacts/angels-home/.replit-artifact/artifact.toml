kind = "web"
previewPath = "/"
title = "엔젤스홈"
version = "1.0.0"
id = "artifacts/angels-home"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20632

[services.development]
run = "pnpm --filter @workspace/angels-home run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/angels-home", "run", "build" ]
publicDir = "artifacts/angels-home/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20632"
BASE_PATH = "/"
